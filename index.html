<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Predict Delay</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <!-- Page Wrapper -->
  <div class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow p-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-gray-800">AI Predict Delay</h1>
      <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700">
        Back to Dashboard
      </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <!-- Card -->
      <div class="bg-white rounded-xl shadow p-6 max-w-5xl mx-auto">

        <!-- Section Title -->
        <h2 class="text-lg font-semibold text-gray-700 mb-4">Select Shipment for Prediction</h2>

        <!-- Shipment Dropdown -->
        <div class="mb-6">
          <select class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option>Select Shipment ID...</option>
            <option>#SHP123 - Delhi to Mumbai</option>
            <option>#SHP456 - Bangalore to Pune</option>
            <option>#SHP789 - Chennai to Hyderabad</option>
          </select>
        </div>

        <!-- Predict Button -->
        <div class="flex justify-end mb-6">
          <button class="px-5 py-2 bg-green-600 text-white rounded-lg shadow hover:bg-green-700">
            Run AI Prediction
          </button>
        </div>

        <!-- Prediction Result -->
        <div class="bg-gray-50 p-6 rounded-lg border border-gray-200">
          <h3 class="text-md font-semibold text-gray-800 mb-2">Prediction Result</h3>
          <p class="text-gray-600">Shipment <strong>#SHP123</strong> has a <span class="text-red-600 font-bold">65% chance</span> of being delayed.</p>
          
          <!-- Confidence Meter -->
          <div class="mt-4">
            <div class="w-full bg-gray-200 rounded-full h-4">
              <div class="bg-red-500 h-4 rounded-full" style="width: 65%;"></div>
            </div>
            <p class="text-sm text-gray-500 mt-1">Confidence Score: 0.78</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
