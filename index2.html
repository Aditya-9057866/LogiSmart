<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Categorize</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <!-- Page Wrapper -->
  <div class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow p-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-gray-800">AI Categorize</h1>
      <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700">
        Back to Dashboard
      </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <div class="bg-white rounded-xl shadow p-6 max-w-5xl mx-auto">

        <!-- Section Title -->
        <h2 class="text-lg font-semibold text-gray-700 mb-4">Upload or Select Product/Shipment</h2>

        <!-- Upload Section -->
        <div class="mb-6 flex items-center gap-4">
          <input type="file" class="border border-gray-300 rounded-lg p-2 w-full focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <button class="px-5 py-2 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700">
            Upload
          </button>
        </div>

        <!-- OR Divider -->
        <div class="flex items-center mb-6">
          <hr class="flex-grow border-gray-300" />
          <span class="px-3 text-gray-500 text-sm">OR</span>
          <hr class="flex-grow border-gray-300" />
        </div>

        <!-- Dropdown -->
        <div class="mb-6">
          <select class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option>Select Existing Item...</option>
            <option>#PDT123 - Electronics</option>
            <option>#PDT456 - Apparel</option>
            <option>#SHP789 - Fragile Goods</option>
          </select>
        </div>

        <!-- Categorize Button -->
        <div class="flex justify-end mb-6">
          <button class="px-5 py-2 bg-green-600 text-white rounded-lg shadow hover:bg-green-700">
            Run AI Categorization
          </button>
        </div>

        <!-- Prediction Result -->
        <div class="bg-gray-50 p-6 rounded-lg border border-gray-200">
          <h3 class="text-md font-semibold text-gray-800 mb-2">Categorization Result</h3>
          <p class="text-gray-600">Item <strong>#PDT123</strong> has been categorized as:</p>

          <div class="mt-4 grid grid-cols-2 gap-4">
            <div class="p-4 bg-blue-100 rounded-lg text-center shadow">
              <p class="text-lg font-bold text-blue-700">Electronics</p>
              <p class="text-sm text-gray-500">Confidence: 0.92</p>
            </div>
            <div class="p-4 bg-yellow-100 rounded-lg text-center shadow">
              <p class="text-lg font-bold text-yellow-700">Fragile</p>
              <p class="text-sm text-gray-500">Confidence: 0.75</p>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</body>
</html>
